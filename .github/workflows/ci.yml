name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint AST safety
        run: genvm-lint check contracts/escrow_arbiter_v3.py
      - name: Lint semantic validate
        run: genvm-lint validate contracts/escrow_arbiter_v3.py
      - name: Direct tests
        run: pytest tests/direct -v
