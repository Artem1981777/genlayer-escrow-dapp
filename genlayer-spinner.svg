<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none" role="img" aria-label="Loading">
  <title>GenLayer</title>
  <defs>
    <linearGradient id="glg" x1="6" y1="6" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#110FFF"/>
      <stop offset="1" stop-color="#7A82FF"/>
    </linearGradient>
    <style>
      .gl-layer { transform-origin: 24px 24px; fill: none; stroke: url(#glg); stroke-linecap: round; }
      .l1 { animation: gl-spin 1.05s linear infinite; }
      .l2 { animation: gl-spin 1.55s linear infinite; }
      .l3 { animation: gl-spin 2.15s linear infinite; }
      @keyframes gl-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .l1,.l2,.l3 { animation-duration: 3.2s; } }
    </style>
  </defs>
  <circle cx="24" cy="24" r="18" fill="none" stroke="#808080" stroke-opacity="0.16" stroke-width="3.2"/>
  <path class="gl-layer l3" stroke-width="3.2" stroke-opacity="1"    d="M24 6 a18 18 0 0 1 15.59 9"/>
  <path class="gl-layer l2" stroke-width="3.2" stroke-opacity="0.72" d="M24 11 a13 13 0 0 1 11.26 6.5"/>
  <path class="gl-layer l1" stroke-width="3.2" stroke-opacity="0.45" d="M24 16 a8 8 0 0 1 6.93 4"/>
  <circle cx="24" cy="24" r="2.4" fill="url(#glg)"/>
</svg>
